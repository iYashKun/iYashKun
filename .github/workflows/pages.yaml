name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp .github/index.html _site/index.html
          cp .github/github.html _site/github.html
          cp .github/test.html _site/test.html

          if [ -d assets ]; then cp -r assets _site/; fi
          if [ -d images ]; then cp -r images _site/; fi
          if [ -d css ]; then cp -r css _site/; fi
          if [ -d js ]; then cp -r js _site/; fi
          if [ -f favicon.ico ]; then cp favicon.ico _site/; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
